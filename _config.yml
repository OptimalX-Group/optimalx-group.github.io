# Basic
name:               "OptimalX"
title:            "OptimalX Group at the University of Minnesota Twin Cities"
description:        "OptimalX is research group at the University of Minnesota Twin Cities focussing on developing efficient and scalable algorithms for control of autonomous systems"

plugins:
  - jekyll-scholar

scholar:
  style: ieee               # Citation style: apa, ieee, chicago, etc.
  locale: en
  source: _bibliography    # Folder where your BibTeX file will be
  bibtex: references.bib # Your BibTeX file
  sort_by: year
  order: descending
# URL
url:                https://optimalx-group.github.io/
baseurl:            
#baseurl:            "" #For Root Domain
permalink:          /:year/:month/:day/:title.html

# Markdown
markdown:           kramdown

# Highlighter
highlighter:        rouge

# Navigation
nav:
  - name:           "home"
    href:           "/"
  - name:           "about"
    href:           "/about"
  - name:           "papers"
    href:           "/papers"
  - name:           "projects"
    href:           "/projects"
  - name:           "people"
    href:           "/people"
  - name:           "Useful"
    href:           "/useful/"
  - name:           "Venues"
    href:           "/venues/"
  - name:           "Lab"
    href:           "/lab/"
  - name:           "Join Us"
    href:           "/joinus/"
  # - name:           "blog"
    # href:           "/blog"
#   - name:           "abstracts"
#     href:           "/abstracts"
  # - name:           "lab teachings"
  #   href:           "/presentations"

# Sass
sass:
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"
  -
    scope:
      path:         ""
      type:         "people"
    values:
      layout:       "profile"


collections:
  people:
    output: true
    permalink: /people/:title/index.html
